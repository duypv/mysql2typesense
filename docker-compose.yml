services:
  mysql:
    image: mysql:8.0
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  typesense:
    image: typesense/typesense:30.0
    command:
      - --data-dir=/data
      - --api-key=xyz
      - --enable-cors
      # Auto-recover a single-node raft that lands in ERROR state (e.g. after the
      # container IP changes or an unclean shutdown) instead of staying stuck
      # returning "503 Not Ready or Lagging" forever.
      - --reset-peers-on-error=true
    ports:
      - "8108:8108"
    volumes:
      - ./typesense-data:/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Give Typesense time to flush a raft snapshot on shutdown. A short grace
    # period (default 10s) can kill it mid-snapshot and corrupt the WAL, which is
    # what leaves the node permanently "Not Ready or Lagging" on next start.
    stop_grace_period: 60s
    # /health returns {"ok":true} only when the node is ready AND the raft node is
    # leader/caught-up; it returns 503 {"ok":false} while "Not Ready or Lagging".
    # Use bash /dev/tcp (the image is Ubuntu-based, /bin/sh is dash without /dev/tcp)
    # so we don't depend on curl/wget being present in the image.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf ''GET /health HTTP/1.0\r\n\r\n'' >&3 && grep -q ''"ok":true'' <&3'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  sync-app:
    platform: linux/amd64
    build:
      context: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root
      DB_NAME: app
      # Local compose MySQL runs in UTC; production servers should set their real offset (e.g. +07:00)
      DB_TIMEZONE: "Z"
      SYNC_CONFIG_PATH: /app/config/sync.config.json
      SYNC_BATCH_SIZE: 100
      TS_NODE_HOST: typesense
      TS_NODE_PORT: 8108
      TS_NODE_PROTOCOL: http
      TS_API_KEY: xyz
      CHECKPOINT_DRIVER: redis
      CHECKPOINT_REDIS_KEY: mysql2typesense:binlog
      REDIS_URL: redis://redis:6379
      RETRY_MAX_ATTEMPTS: 10
      RETRY_BASE_DELAY_MS: 1000
      MONITORING_ENABLED: true
      MONITORING_PORT: 8080
      MONITORING_AUTH_TOKEN: changeme
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    command: ["npm", "run", "sync:bootstrap"]
